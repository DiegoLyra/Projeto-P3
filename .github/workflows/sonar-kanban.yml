name: Sincronizar SonarQube com o Kanban

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script de sincronização
        env:
          SONARQUBE_URL: "https://sonarcloud.io"
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -c '
          import os
          import re
          import sys
          import random
          import requests

          sonar_url = os.environ.get("SONARQUBE_URL", "").strip().rstrip("/")
          sonar_token = os.environ.get("SONAR_TOKEN", "").strip()
          sonar_project = os.environ.get("SONAR_PROJECT_KEY", "").strip()
          gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
          gh_repo = os.environ.get("GITHUB_REPO", "").strip()

          # Integrantes elegíveis para atribuição aleatória das issues do Sonar.
          # Precisam ser colaboradores com acesso de escrita no repositório,
          # senão o GitHub ignora silenciosamente o assignee inválido.
          INTEGRANTES = [
              "DiegoLyra",
              "joaogt01",
              "usermenob",
              "joaoflaviolima53",
              "Vinicius-MQ",
          ]

          github_api_url = f"https://api.github.com/repos/{gh_repo}/issues"
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json"
          }

          print(f"Conectando na URL: {sonar_url}")
          print(f"Projeto: {sonar_project}")

          issues_url = f"{sonar_url}/api/issues/search"
          params = {
              "componentKeys": sonar_project,
              "statuses": "OPEN,CONFIRMED,REOPENED",
              "ps": 100,
          }

          response = requests.get(issues_url, params=params, auth=(sonar_token, ""))

          if response.status_code != 200:
              print(f"Erro ao conectar no SonarQube: {response.status_code} - {response.text}")
              sys.exit(1)

          issues_abertas_sonar = response.json().get("issues", [])
          chaves_ativas = {issue.get("key") for issue in issues_abertas_sonar}
          print(f"Sonar reporta {len(issues_abertas_sonar)} issues abertas.")

          def buscar_issues_github(estado):
              todas = []
              pagina = 1
              while True:
                  params_gh = {
                      "labels": "sonar-bug",
                      "state": estado,
                      "per_page": 100,
                      "page": pagina,
                  }
                  resp = requests.get(github_api_url, params=params_gh, headers=headers)
                  if resp.status_code != 200:
                      print(f"Erro ao buscar issues do GitHub ({estado}): {resp.status_code} - {resp.text}")
                      break
                  pagina_dados = resp.json()
                  if not pagina_dados:
                      break
                  todas.extend(pagina_dados)
                  pagina += 1
              return todas

          issues_github_abertas = buscar_issues_github("open")
          print(f"GitHub possui {len(issues_github_abertas)} issues abertas com label sonar-bug.")

          # Mapa chave-sonar -> issue do github, extraída do corpo
          padrao_chave = re.compile(r"<!-- sonar-key: (.+?) -->")

          chave_para_issue_github = {}
          for issue_gh in issues_github_abertas:
              corpo = issue_gh.get("body") or ""
              match = padrao_chave.search(corpo)
              if match:
                  chave_para_issue_github[match.group(1)] = issue_gh

          fechadas = 0
          for chave_gh, issue_gh in chave_para_issue_github.items():
              if chave_gh not in chaves_ativas:
                  numero = issue_gh["number"]
                  close_url = f"{github_api_url}/{numero}"
                  comentario_url = f"{github_api_url}/{numero}/comments"

                  requests.post(
                      comentario_url,
                      json={"body": "Issue resolvida no SonarQube — fechando automaticamente."},
                      headers=headers,
                  )
                  resp_close = requests.patch(close_url, json={"state": "closed"}, headers=headers)

                  if resp_close.status_code == 200:
                      fechadas += 1
                      print(f"Issue fechada automaticamente: #{numero} - {issue_gh['title']}")
                  else:
                      print(f"Falha ao fechar issue #{numero}: {resp_close.status_code} - {resp_close.text}")

          print(f"Total de issues fechadas: {fechadas}")

          criadas = 0
          for issue in issues_abertas_sonar:
              chave = issue.get("key")

              if chave in chave_para_issue_github:
                  # já existe issue aberta correspondente, não duplica
                  continue

              message = issue.get("message")
              component = issue.get("component", "").split(":")[-1]
              severity = issue.get("severity")
              rule = issue.get("rule")

              title = f"[SonarQube] [{severity}] {message[:80]}"
              body = (
                  f"<!-- sonar-key: {chave} -->\n"
                  f"**Alerta gerado automaticamente pelo SonarQube**\n\n"
                  f"- **Mensagem:** {message}\n"
                  f"- **Arquivo/Componente:** `{component}`\n"
                  f"- **Severidade:** {severity}\n"
                  f"- **Regra:** `{rule}`\n\n"
                  f"Por favor, revise este ponto de melhoria/correção no código.\n\n"
                  f"_Esta issue será fechada automaticamente quando o Sonar deixar de reportá-la._"
              )

              responsavel = random.choice(INTEGRANTES) if INTEGRANTES else None

              payload = {
                  "title": title,
                  "body": body,
                  "labels": ["sonar-bug", severity.lower()]
              }
              if responsavel:
                  payload["assignees"] = [responsavel]

              gh_response = requests.post(github_api_url, json=payload, headers=headers)
              if gh_response.status_code == 201:
                  criadas += 1
                  if responsavel:
                      print(f"Issue criada: {title} (atribuída a {responsavel})")
                  else:
                      print(f"Issue criada: {title}")
              else:
                  print(f"Falha ao criar issue: {gh_response.status_code} - {gh_response.text}")

          print(f"Total de issues criadas: {criadas}")
          '