name: Sincronizar SonarQube com o Kanban

on:
  schedule:
    - cron: '0 8 * * *'
  
  workflow_dispatch:

jobs:
  sync-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script de sincronização
        env:
          SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -c '
          import os
          import requests

          sonar_url = os.environ["SONARQUBE_URL"]
          sonar_token = os.environ["SONAR_TOKEN"]
          sonar_project = os.environ["SONAR_PROJECT_KEY"]
          gh_token = os.environ["GITHUB_TOKEN"]
          gh_repo = os.environ["GITHUB_REPO"]

          issues_url = f"{sonar_url}/api/issues/search"
          params = {
              "componentKeys": sonar_project,
              "statuses": "OPEN,CONFIRMED,REOPENED",
              "ps": 50,
          }

          print("Buscando issues no SonarQube...")
          response = requests.get(issues_url, params=params, auth=(sonar_token, ""))

          if response.status_code != 200:
              print(f"Erro ao conectar no SonarQube: {response.status_code}")
              exit(1)

          issues_data = response.json().get("issues", [])
          print(f"Encontradas {len(issues_data)} pendências. Criando issues no GitHub...")

          github_api_url = f"https://api.github.com/repos/{gh_repo}/issues"
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json"
          }

          for issue in issues_data:
              message = issue.get("message")
              component = issue.get("component", "").split(":")[-1]
              severity = issue.get("severity")
              rule = issue.get("rule")
              
              title = f"[SonarQube] [{severity}] {message[:80]}"
              body = (
                  f"**Alerta gerado automaticamente pelo SonarQube**\n\n"
                  f"- **Mensagem:** {message}\n"
                  f"- **Arquivo/Componente:** `{component}`\n"
                  f"- **Severidade:** {severity}\n"
                  f"- **Regra:** `{rule}`\n\n"
                  f"Por favor, revise este ponto de melhoria/correção no código."
              )
              
              payload = {
                  "title": title,
                  "body": body,
                  "labels": ["sonar-bug", severity.lower()]
              }
              
              gh_response = requests.post(github_api_url, json=payload, headers=headers)
              if gh_response.status_code == 201:
                  print(f"Issue criada: {title}")
              else:
                  print(f"Falha ao criar issue (pode já existir ou erro de token): {gh_response.status_code}")
          '